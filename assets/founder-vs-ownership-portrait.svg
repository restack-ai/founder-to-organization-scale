<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Founder-driven vs ownership-driven scale comparison">
  <defs>
    <style>
      .title{font:700 48px Arial, sans-serif;fill:#111827}.sub{font:22px Arial,sans-serif;fill:#4b5563}.h{font:700 28px Arial,sans-serif;fill:#111827}.body{font:20px Arial,sans-serif;fill:#374151}.small{font:16px Arial,sans-serif;fill:#4b5563}.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:2;rx:18}.left{fill:#f3f4f6;stroke:#9ca3af}.right{fill:#eff6ff;stroke:#60a5fa}.dark{fill:#111827}.blue{fill:#0f4c81}.line{stroke:#6b7280;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}.arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="1800" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" class="title">Founder Scale → Organization Scale</text>
  <text x="600" y="110" text-anchor="middle" class="sub">Culture is how decisions move.</text>

  <rect x="70" y="160" width="500" height="1200" class="box left"/>
  <rect x="630" y="160" width="500" height="1200" class="box right"/>

  <text x="320" y="215" text-anchor="middle" class="h">Founder-Driven Culture</text>
  <text x="880" y="215" text-anchor="middle" class="h">Ownership-Driven Culture</text>
  <text x="320" y="250" text-anchor="middle" class="sub">One queue</text>
  <text x="880" y="250" text-anchor="middle" class="sub">Parallel decisions</text>

  <circle cx="320" cy="350" r="65" class="dark"/>
  <text x="320" y="340" text-anchor="middle" fill="#fff" font="700 24px Arial">Founder</text>
  <text x="320" y="372" text-anchor="middle" fill="#fff" font="18px Arial">approves</text>

  <rect x="210" y="470" width="220" height="80" rx="12" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
  <text x="320" y="518" text-anchor="middle" class="body">Decision Queue</text>
  <path d="M320 415 L320 470" class="line arrow"/>

  <g class="body">
    <rect x="115" y="650" width="90" height="70" rx="12" fill="#fff" stroke="#9ca3af"/>
    <rect x="250" y="650" width="90" height="70" rx="12" fill="#fff" stroke="#9ca3af"/>
    <rect x="385" y="650" width="90" height="70" rx="12" fill="#fff" stroke="#9ca3af"/>
    <text x="160" y="695" text-anchor="middle" class="small">Product waits</text>
    <text x="295" y="695" text-anchor="middle" class="small">Eng waits</text>
    <text x="430" y="695" text-anchor="middle" class="small">GTM waits</text>
  </g>
  <path d="M320 550 L160 650" class="line arrow"/>
  <path d="M320 550 L295 650" class="line arrow"/>
  <path d="M320 550 L430 650" class="line arrow"/>

  <rect x="115" y="810" width="410" height="120" rx="16" fill="#fff" stroke="#d1d5db"/>
  <text x="320" y="855" text-anchor="middle" class="h">Scale Limit</text>
  <text x="320" y="890" text-anchor="middle" class="body">Growth is capped by founder time,</text>
  <text x="320" y="920" text-anchor="middle" class="body">attention, and context switching.</text>

  <path d="M125 1080 C210 950, 360 955, 520 955" stroke="#374151" stroke-width="8" fill="none"/>
  <path d="M125 1080 L125 960" class="line"/><path d="M125 1080 L520 1080" class="line"/>
  <text x="320" y="1160" text-anchor="middle" class="body">Serial decision throughput</text>

  <circle cx="880" cy="350" r="70" class="blue"/>
  <text x="880" y="338" text-anchor="middle" fill="#fff" font="700 22px Arial">Founder / CEO</text>
  <text x="880" y="370" text-anchor="middle" fill="#fff" font="17px Arial">sets doctrine</text>

  <rect x="740" y="460" width="280" height="90" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="880" y="500" text-anchor="middle" class="body">Guardrails</text>
  <text x="880" y="528" text-anchor="middle" class="small">rights • KPIs • reviews</text>
  <path d="M880 420 L880 460" class="line arrow"/>

  <g>
    <circle cx="710" cy="680" r="45" class="blue"/><text x="710" y="686" text-anchor="middle" fill="#fff" font="18px Arial">DRI A</text>
    <circle cx="820" cy="680" r="45" class="blue"/><text x="820" y="686" text-anchor="middle" fill="#fff" font="18px Arial">DRI B</text>
    <circle cx="930" cy="680" r="45" class="blue"/><text x="930" y="686" text-anchor="middle" fill="#fff" font="18px Arial">DRI C</text>
    <circle cx="1040" cy="680" r="45" class="blue"/><text x="1040" y="686" text-anchor="middle" fill="#fff" font="18px Arial">DRI D</text>
  </g>
  <path d="M880 550 L710 635" class="line dash arrow"/><path d="M880 550 L820 635" class="line dash arrow"/><path d="M880 550 L930 635" class="line dash arrow"/><path d="M880 550 L1040 635" class="line dash arrow"/>

  <rect x="675" y="810" width="410" height="120" rx="16" fill="#fff" stroke="#bfdbfe"/>
  <text x="880" y="855" text-anchor="middle" class="h">Scale Potential</text>
  <text x="880" y="890" text-anchor="middle" class="body">Growth compounds through</text>
  <text x="880" y="920" text-anchor="middle" class="body">distributed ownership.</text>

  <path d="M685 1080 C780 1075, 920 1025, 1070 920" stroke="#0f4c81" stroke-width="8" fill="none"/>
  <path d="M685 1080 L685 960" class="line"/><path d="M685 1080 L1080 1080" class="line"/>
  <text x="880" y="1160" text-anchor="middle" class="body">Parallel decision throughput</text>

  <rect x="120" y="1430" width="960" height="180" rx="24" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="600" y="1495" text-anchor="middle" class="h">The AI Agent drift</text>
  <text x="600" y="1535" text-anchor="middle" class="body">Decision preparation decentralizes.</text>
  <text x="600" y="1570" text-anchor="middle" class="body">Governance, permissions, evals, and observability centralize.</text>

  <text x="600" y="1705" text-anchor="middle" font="700 34px Arial" fill="#0f4c81">The scalable organization is not less controlled.</text>
  <text x="600" y="1750" text-anchor="middle" font="700 34px Arial" fill="#0f4c81">It is controlled by a better system.</text>
</svg>
