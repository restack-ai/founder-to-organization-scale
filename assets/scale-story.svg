<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From founder scale to organization scale to AI-agent scale</title>
  <desc id="desc">A three-act animated diagram: founder scale, where every decision converges on one person and waits in one queue; organization scale, where many owners decide in parallel inside clear guardrails; and AI-agent scale, where humans set intent, agents execute bounded work, and governance becomes infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L9,5 L0,9.5 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg{fill:url(#bg)}
      .panel{fill:#ffffff;stroke:#dbe4ee;stroke-width:1.5;filter:url(#softShadow)}
      .stage{font:700 14px Arial,sans-serif;fill:#0f4c81;letter-spacing:.06em}
      .label{font:700 16px Arial,sans-serif;fill:#111827}
      .small{font:14px Arial,sans-serif;fill:#64748b}
      .tiny{font:12px Arial,sans-serif;fill:#64748b}
      .node{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .nodeDark{fill:#111827;stroke:#111827}
      .nodeBlue{fill:#0f4c81;stroke:#0f4c81}
      .guard{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}
      .line{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0f4c81;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 200;opacity:.86;animation:flow 4.2s ease-in-out infinite}
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}
      .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .blink{animation:blink 2.4s ease-in-out infinite}
      .b1{animation-delay:.4s}.b2{animation-delay:.8s}
      .glow{animation:glow 3.6s ease-in-out infinite}
      .act{animation:fadeIn .9s ease-out both}
      .a2{animation-delay:.3s}.a3{animation-delay:.6s}
      .step{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s ease-out both}
      .s1{animation-delay:1s}.s2{animation-delay:1.3s}
      @keyframes flow{0%{stroke-dashoffset:214}55%,100%{stroke-dashoffset:-36}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.055);opacity:.9}}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
      @keyframes fadeIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){
        .flow,.pulse,.blink,.glow,.act,.step{animation:none}
        .step{stroke-dashoffset:0}
        .flow{opacity:0}
        .blink{opacity:1}
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="360" rx="28" fill="#ffffff"/>

  <!-- Act 1: Founder scale — every decision converges on one person -->
  <g transform="translate(64,24)"><g class="act">
    <rect class="panel" x="0" y="0" width="340" height="312" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/>
    <text x="24" y="40" class="stage" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f4c81">01 · FOUNDER SCALE</text>

    <circle cx="50" cy="86" r="4" fill="#94a3b8"/>
    <circle cx="110" cy="72" r="4" fill="#94a3b8"/>
    <circle cx="170" cy="66" r="4" fill="#94a3b8"/>
    <circle cx="230" cy="72" r="4" fill="#94a3b8"/>
    <circle cx="290" cy="86" r="4" fill="#94a3b8"/>

    <path d="M54 92 L146 142" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M112 80 L158 130" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M170 74 L170 124" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M228 80 L182 130" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M286 92 L194 142" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M54 92 L146 142" class="flow" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M112 80 L158 130" class="flow d1" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M170 74 L170 124" class="flow d2" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M228 80 L182 130" class="flow d3" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M286 92 L194 142" class="flow d4" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>

    <g class="pulse">
      <circle cx="170" cy="170" r="38" class="nodeDark" fill="#111827" stroke="#111827"/>
      <text x="170" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Founder</text>
      <text x="170" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d1d5db">queue</text>
    </g>

    <circle cx="238" cy="150" r="5" class="blink" fill="#94a3b8"/>
    <circle cx="252" cy="136" r="5" class="blink b1" fill="#94a3b8"/>
    <circle cx="266" cy="122" r="5" class="blink b2" fill="#94a3b8"/>
    <text x="278" y="112" class="tiny" font-family="Arial, sans-serif" font-size="12" fill="#64748b">waiting</text>

    <text x="170" y="272" text-anchor="middle" class="label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">One decision queue</text>
    <text x="170" y="292" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Speed = one person's bandwidth</text>
  </g></g>

  <path d="M409 180 L426 180" class="line step s1" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Act 2: Organization scale — many owners decide in parallel inside guardrails -->
  <g transform="translate(430,24)"><g class="act a2">
    <rect class="panel" x="0" y="0" width="340" height="312" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/>
    <text x="24" y="40" class="stage" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f4c81">02 · ORGANIZATION SCALE</text>

    <circle cx="84" cy="68" r="4" fill="#94a3b8"/>
    <circle cx="170" cy="68" r="4" fill="#94a3b8"/>
    <circle cx="256" cy="68" r="4" fill="#94a3b8"/>

    <rect class="guard" x="24" y="88" width="292" height="140" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>

    <path d="M84 74 L84 132" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M170 74 L170 132" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M256 74 L256 132" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M84 74 L84 132" class="flow" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M170 74 L170 132" class="flow d1" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M256 74 L256 132" class="flow d2" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>

    <g class="pulse">
      <circle cx="84" cy="170" r="30" class="nodeBlue" fill="#0f4c81" stroke="#0f4c81"/>
      <text x="84" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Product</text>
      <text x="84" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">DRI</text>
    </g>
    <g class="pulse" style="animation-delay:.7s">
      <circle cx="170" cy="170" r="30" class="nodeBlue" fill="#0f4c81" stroke="#0f4c81"/>
      <text x="170" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Eng</text>
      <text x="170" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">DRI</text>
    </g>
    <g class="pulse" style="animation-delay:1.4s">
      <circle cx="256" cy="170" r="30" class="nodeBlue" fill="#0f4c81" stroke="#0f4c81"/>
      <text x="256" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">GTM</text>
      <text x="256" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe">DRI</text>
    </g>

    <text x="170" y="216" text-anchor="middle" class="tiny" font-family="Arial, sans-serif" font-size="12" fill="#64748b">guardrails: decision rights · KPIs · reviews</text>

    <text x="170" y="272" text-anchor="middle" class="label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Many owners, clear guardrails</text>
    <text x="170" y="292" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Speed = quality of the decision system</text>
  </g></g>

  <path d="M775 180 L792 180" class="line step s2" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Act 3: AI-agent scale — humans set intent, agents execute, governance is infrastructure -->
  <g transform="translate(796,24)"><g class="act a3">
    <rect class="panel" x="0" y="0" width="340" height="312" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5"/>
    <text x="24" y="40" class="stage" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f4c81">03 · AI-AGENT SCALE</text>

    <g class="pulse">
      <circle cx="170" cy="88" r="28" class="nodeDark" fill="#111827" stroke="#111827"/>
      <text x="170" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Human</text>
      <text x="170" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d1d5db">intent</text>
    </g>

    <path d="M152 110 L92 144" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M170 118 L170 144" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M188 110 L248 144" class="line" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M152 110 L92 144" class="flow" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M170 118 L170 144" class="flow d1" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>
    <path d="M188 110 L248 144" class="flow d2" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 200" opacity=".86"/>

    <g>
      <rect x="54" y="150" width="60" height="40" rx="10" class="node" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="84" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Agent</text>
      <text x="84" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">bounded</text>
      <rect x="140" y="150" width="60" height="40" rx="10" class="node" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="170" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Agent</text>
      <text x="170" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">bounded</text>
      <rect x="226" y="150" width="60" height="40" rx="10" class="node" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="256" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Agent</text>
      <text x="256" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">bounded</text>
    </g>

    <g class="glow">
      <rect class="guard" x="24" y="208" width="292" height="36" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="170" y="231" text-anchor="middle" class="tiny" font-family="Arial, sans-serif" font-size="12" fill="#64748b">policy · permissions · evals · approval tiers</text>
    </g>

    <text x="170" y="272" text-anchor="middle" class="label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Intent in, bounded execution out</text>
    <text x="170" y="292" text-anchor="middle" class="small" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Governance becomes infrastructure</text>
  </g></g>
</svg>
